<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fancy Weather Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* CSS Reset and Base Styles */
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Poppins', sans-serif;
  background: url('https://images.unsplash.com/photo-1504608524841-42ce6f141f65?ixlib=rb-4.0.3&auto=format&fit=crop&w=2070&q=80') no-repeat center center fixed;
  background-size: cover;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #fff;
}
.overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.4);
  z-index: 1;
}
.container {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 900px;
  margin: 40px 20px;
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 20px;
  padding: 30px;
  box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
}
h1 {
  text-align: center;
  font-weight: 600;
  margin-bottom: 25px;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
}
/* Controls */
.controls {
  display: flex;
  flex-direction: column;
  gap: 15px;
  margin-bottom: 25px;
}
.search-box {
  display: flex;
  gap: 10px;
}
.recent-searches {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 20px;
}
.recent-btn {
  background: rgba(255, 255, 255, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.3);
  padding: 6px 12px;
  border-radius: 15px;
  font-size: 13px;
  color: white;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: none;
}
.recent-btn:hover {
  background: rgba(255, 255, 255, 0.3);
  transform: translateY(-1px);
}
.unit-toggle {
  background: rgba(255, 255, 255, 0.2);
  border: 1px solid rgba(255, 255, 255, 0.3);
  border-radius: 30px;
  display: flex;
  overflow: hidden;
}
.unit-toggle button {
  background: transparent;
  border-radius: 0;
  box-shadow: none;
  color: rgba(255,255,255,0.7);
  padding: 8px 15px;
  font-size: 14px;
}
.unit-toggle button.active {
  background: rgba(255, 255, 255, 0.3);
  color: white;
  font-weight: 600;
}
.unit-toggle button:hover {
  transform: none;
  box-shadow: none;
  background: rgba(255, 255, 255, 0.4);
}
input {
  flex: 1;
  padding: 12px 20px;
  border-radius: 30px;
  border: 1px solid rgba(255, 255, 255, 0.3);
  background: rgba(255, 255, 255, 0.2);
  color: #fff;
  font-size: 16px;
  font-family: 'Poppins', sans-serif;
  outline: none;
  transition: all 0.3s ease;
}
input::placeholder { color: rgba(255, 255, 255, 0.7); }
input:focus {
  background: rgba(255, 255, 255, 0.3);
  border-color: rgba(255, 255, 255, 0.5);
}
button {
  padding: 12px 24px;
  border: none;
  border-radius: 30px;
  background: linear-gradient(135deg, #6e8efb, #a777e3);
  color: white;
  cursor: pointer;
  font-size: 16px;
  font-family: 'Poppins', sans-serif;
  font-weight: 500;
  transition: transform 0.2s, box-shadow 0.2s;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}
button:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0,0,0,0.3);
}
.action-buttons {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.locate-btn {
  background: linear-gradient(135deg, #11998e, #38ef7d);
}
/* Weather Card */
.weather-card {
  text-align: center;
  animation: fadeIn 0.5s ease-out;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.city-name { font-size: 28px; font-weight: 600; margin-bottom: 5px; }
.weather-main { display: flex; align-items: center; justify-content: center; gap: 20px; }
.temp { font-size: 72px; font-weight: 700; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
.icon-large { width: 120px; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.3)); }
.condition { font-size: 22px; text-transform: capitalize; font-weight: 300; margin-bottom: 20px; }
/* Details Grid */
.details-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 15px;
  margin-top: 25px;
  border-top: 1px solid rgba(255, 255, 255, 0.2);
  padding-top: 25px;
}
.detail-item {
  background: rgba(0, 0, 0, 0.2);
  padding: 15px;
  border-radius: 15px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.detail-item span { font-size: 14px; opacity: 0.8; margin-top: 5px; }
.detail-item strong { font-size: 18px; font-weight: 600; }
.error { text-align: center; font-size: 18px; color: #ff6b6b; font-weight: 500; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 10px;}
/* Forecast */
.forecast-container {
  margin-top: 30px;
  border-top: 1px solid rgba(255, 255, 255, 0.2);
  padding-top: 20px;
}
.forecast-title { font-size: 20px; font-weight: 600; margin-bottom: 15px; text-align: center; }
.forecast-grid {
  display: flex;
  justify-content: space-between;
  overflow-x: auto;
  gap: 15px;
  padding-bottom: 10px;
}
.forecast-grid::-webkit-scrollbar { height: 8px; }
.forecast-grid::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); border-radius: 4px; }
.forecast-grid::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 4px; }
.forecast-item {
  background: rgba(0, 0, 0, 0.2);
  padding: 15px;
  border-radius: 15px;
  min-width: 100px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.forecast-item img { width: 50px; }
.forecast-day { font-size: 14px; font-weight: 500; margin-bottom: 5px; }
.forecast-temp { font-size: 16px; font-weight: 600; }
</style>
</head>
<body>
<div class="overlay"></div>
<div class="container">
  <h1>Weather Dashboard</h1>
  <div class="controls">
    <div class="search-box">
      <input type="text" id="cityInput" placeholder="Search for a city...">
      <button onclick="searchCity()">Search</button>
    </div>
    <div class="action-buttons">
      <button class="locate-btn" onclick="useMyLocation()">📍 Use My Location</button>
      <div class="unit-toggle">
        <button id="btnMetric" class="active" onclick="setUnit('metric')">°C</button>
        <button id="btnImperial" onclick="setUnit('imperial')">°F</button>
      </div>
    </div>
    <div class="recent-searches" id="recentSearches"></div>
  </div>
  <div id="result"></div>
</div>

<script>
const API_KEY = "3ea461e04a212d6b62fec8afe2faed54";
let currentUnit = 'metric';
let lastSearchQuery = '';
let lastSearchIsLocation = false;
let recentCities = JSON.parse(localStorage.getItem('recentCities')) || [];

function showError(msg) {
  document.getElementById("result").innerHTML = `<p class="error">${msg}</p>`;
}

function updateRecentSearchesUI() {
  const container = document.getElementById('recentSearches');
  container.innerHTML = '';
  recentCities.forEach(city => {
    const btn = document.createElement('button');
    btn.className = 'recent-btn';
    btn.innerText = city;
    btn.onclick = () => {
      document.getElementById('cityInput').value = city;
      searchCity();
    };
    container.appendChild(btn);
  });
}

function saveRecentSearch(city) {
  if (!recentCities.includes(city)) {
    recentCities.unshift(city);
    if (recentCities.length > 5) recentCities.pop(); // Keep only last 5
    localStorage.setItem('recentCities', JSON.stringify(recentCities));
    updateRecentSearchesUI();
  }
}

function setUnit(unit) {
  if (currentUnit === unit) return;
  currentUnit = unit;
  document.getElementById('btnMetric').classList.toggle('active', unit === 'metric');
  document.getElementById('btnImperial').classList.toggle('active', unit === 'imperial');

  if (lastSearchIsLocation) {
    useMyLocation();
  } else if (lastSearchQuery) {
    // Re-fetch using the query string so the correct units param is applied
    const url = `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(lastSearchQuery)}&units=${currentUnit}&appid=${API_KEY}`;
    fetchWeather(url);
  }
}

function formatTime(timestamp, timezone) {
  const date = new Date((timestamp + timezone) * 1000);
  return date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', timeZone: 'UTC' });
}

function getDayName(dateString, timezoneOffset) {
  const date = new Date((new Date(dateString).getTime()) + timezoneOffset * 1000);
  return date.toLocaleDateString('en-US', { weekday: 'short' });
}

async function fetchForecast(lat, lon) {
  try {
    const response = await fetch(`https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&units=${currentUnit}&appid=${API_KEY}`);
    if (!response.ok) return null;
    return await response.json();
  } catch (e) {
    return null;
  }
}

function renderForecast(forecastData) {
  if (!forecastData) return '';

  // Filter for one reading per day (e.g., around 12:00 PM)
  const dailyData = forecastData.list.filter(item => item.dt_txt.includes("12:00:00"));

  let forecastHtml = `
    <div class="forecast-container">
      <div class="forecast-title">5-Day Forecast</div>
      <div class="forecast-grid">
  `;

  dailyData.forEach(day => {
    const dayName = new Date(day.dt * 1000).toLocaleDateString('en-US', { weekday: 'short' });
    forecastHtml += `
      <div class="forecast-item">
        <div class="forecast-day">${dayName}</div>
        <img src="https://openweathermap.org/img/wn/${day.weather[0].icon}.png" alt="${day.weather[0].description}">
        <div class="forecast-temp">${Math.round(day.main.temp)}°${currentUnit === 'metric' ? 'C' : 'F'}</div>
      </div>
    `;
  });

  forecastHtml += `
      </div>
    </div>
  `;
  return forecastHtml;
}

async function fetchWeather(url) {
  document.getElementById("result").innerHTML = "<p style='text-align:center;'>Loading...</p>";
  try {
    const response = await fetch(url);
    if (!response.ok) {
      showError("City not found or API error.");
      return;
    }
    const data = await response.json();

    // Fetch forecast
    const forecastData = await fetchForecast(data.coord.lat, data.coord.lon);

    // Save to recent searches (we capitalize first letter for display) after success
    if (!lastSearchIsLocation) {
      const formattedCity = data.name;
      saveRecentSearch(formattedCity);
    }

    // Render current weather
    const tempUnit = currentUnit === 'metric' ? '°C' : '°F';
    const speedUnit = currentUnit === 'metric' ? 'm/s' : 'mph';

    const html = `
      <div class="weather-card">
        <div class="city-name">${data.name}, ${data.sys.country}</div>
        <div class="weather-main">
          <img class="icon-large" src="https://openweathermap.org/img/wn/${data.weather[0].icon}@4x.png" alt="${data.weather[0].description}">
          <div class="temp">${Math.round(data.main.temp)}${tempUnit}</div>
        </div>
        <div class="condition">${data.weather[0].description}</div>
        <div class="details-grid">
          <div class="detail-item"><strong>${Math.round(data.main.feels_like)}${tempUnit}</strong><span>Feels like</span></div>
          <div class="detail-item"><strong>${data.main.humidity}%</strong><span>Humidity</span></div>
          <div class="detail-item"><strong>${Math.round(data.wind.speed)} ${speedUnit}</strong><span>Wind</span></div>
          <div class="detail-item"><strong>${data.main.pressure} hPa</strong><span>Pressure</span></div>
          <div class="detail-item"><strong>${(data.visibility / 1000).toFixed(1)} km</strong><span>Visibility</span></div>
          <div class="detail-item"><strong>${formatTime(data.sys.sunrise, data.timezone)}</strong><span>Sunrise</span></div>
          <div class="detail-item"><strong>${formatTime(data.sys.sunset, data.timezone)}</strong><span>Sunset</span></div>
        </div>
        ${renderForecast(forecastData)}
      </div>
    `;
    document.getElementById("result").innerHTML = html;

  } catch (err) {
    showError("Network error.");
  }
}

function searchCity() {
  const city = document.getElementById("cityInput").value.trim();
  if (!city) return;
  lastSearchIsLocation = false;
  lastSearchQuery = city; // Store just the city name, not the URL
  const url = `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&units=${currentUnit}&appid=${API_KEY}`;

  fetchWeather(url);
}

function useMyLocation() {
  if (!navigator.geolocation) {
    showError("Geolocation not supported by your browser.");
    return;
  }
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      lastSearchIsLocation = true;
      const url = `https://api.openweathermap.org/data/2.5/weather?lat=${pos.coords.latitude}&lon=${pos.coords.longitude}&units=${currentUnit}&appid=${API_KEY}`;
      lastSearchQuery = url;
      fetchWeather(url);
    },
    () => showError("Location access denied.")
  );
}

document.getElementById("cityInput").addEventListener("keypress", (e) => {
  if (e.key === "Enter") searchCity();
});

// Initialize recent searches on load
updateRecentSearchesUI();
</script>
</body>
</html>
